[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cube-databricks-metric-view-bridge"
version = "0.1.0"
description = "Cube-owned bridge for converting Cube views to Databricks Metric Views through Apache Ossie"
authors = [{ name = "Cube Dev, Inc.", email = "hello@cube.dev" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "apache-ossie==0.2.0.dev0",
    "apache-ossie-cube==0.2.0.dev0",
    "apache-ossie-databricks==0.2.0.dev0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "sqlglot>=20.0",
]

[project.urls]
repository = "https://github.com/cubedevinc/cube-databricks-metric-view-bridge"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cube_databricks_metric_view_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.uv]
required-version = ">=0.10.0"
default-groups = ["dev"]

[tool.uv.sources]
apache-ossie = { git = "https://github.com/apache/ossie.git", rev = "71222da768cf792e8820a08f77e5b37d649842d9", subdirectory = "python" }
apache-ossie-cube = { git = "https://github.com/apache/ossie.git", rev = "71222da768cf792e8820a08f77e5b37d649842d9", subdirectory = "converters/cube" }
apache-ossie-databricks = { git = "https://github.com/apache/ossie.git", rev = "71222da768cf792e8820a08f77e5b37d649842d9", subdirectory = "converters/databricks" }
